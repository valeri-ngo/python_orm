{% extends 'common/base.html' %}

{% block content %}

<!-- Catalog with Albums-->
<section id="catalogPage">


    <!-- If albums in catalog -->
    {% if albums %}
        <h1>All Albums</h1>
    <!--  If No albums in catalog -->
    {% else %}
        <p>No Albums in Catalog!</p>
    {% endif %}


    {% for album in albums %}
    <!-- First Card-Box in catalog -->
    <div class="card-box">
        <img src="{{ album.image_url }}" alt="Cover Image">
        <div>
            <div class="text-center">
                <p class="name">Name: {{ album.album_name }}</p>
                <p class="price">Price: {{ album.price }}</p>
            </div>
            <div class="btn-group">
                <a href="{% url 'details-album' pk=album.id %}">Details</a>
            </div>
        </div>
    </div>
    <!-- End First Card-Box in catalog -->
     {% endfor %}

</section>
{% endblock %}
